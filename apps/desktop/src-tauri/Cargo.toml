[package]
name = "submind-desktop"
version = "0.1.0"
description = "SubMind native desktop shell"
edition = "2021"

[lib]
name = "submind_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
submind-runtime = { path = "../../../packages/runtime-native" }
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
